<div class="dashboard-container">
  <h1 class="dashboard-title">داشبورد ادمین</h1>

  <div class="stats-grid">
    <mat-card class="stat-card">
      <mat-card-title>تعداد کاربران</mat-card-title>
      <mat-card-content>{{ userCount }}</mat-card-content>
    </mat-card>
    <mat-card class="stat-card">
      <mat-card-title>محصولات</mat-card-title>
      <mat-card-content>{{ productCount }}</mat-card-content>
    </mat-card>
    <mat-card class="stat-card">
      <mat-card-title>سفارش‌ها</mat-card-title>
      <mat-card-content>{{ orderCount }}</mat-card-content>
    </mat-card>
  </div>

  <div class="chart-section">
    <h2 class="chart-title">روند ثبت‌نام کاربران</h2>
    <div class="chart-container">
      <canvas baseChart [data]="chartData" [options]="chartOptions" [type]="'line'"></canvas>
    </div>
  </div>
</div>
