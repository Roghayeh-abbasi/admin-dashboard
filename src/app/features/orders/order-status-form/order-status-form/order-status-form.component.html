<div class="p-6 bg-gradient-to-b from-neutral-50 to-neutral-100 dark:from-neutral-800 dark:to-neutral-900 rounded-xl shadow-md font-['iran_yekan']" dir="rtl">
  <h2 mat-dialog-title class="text-lg font-bold text-neutral-900 dark:text-neutral-50 mb-4">تغییر وضعیت سفارش</h2>
  <mat-dialog-content class="py-6">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>وضعیت</mat-label>
      <mat-select [ngModel]="status()" (ngModelChange)="status.set($event)" class="bg-neutral-100 dark:bg-neutral-700 text-neutral-900 dark:text-neutral-50 rounded-xl px-4 py-3 text-sm transition-all duration-300 focus:border-primary-500 focus:shadow-[0_0_0_3px_rgba(59,130,246,0.2)]">
        @for (status of statuses; track status) {
          <mat-option [value]="status">{{ status | orderStatus }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end" class="flex gap-3 items-center">
    <button mat-button (click)="dialogRef.close()" class="bg-neutral-100 dark:bg-neutral-700 text-neutral-900 dark:text-neutral-50 border border-neutral-300 dark:border-neutral-600 px-4 py-3 rounded-lg text-sm font-semibold transition-all duration-300 hover:bg-neutral-200 dark:hover:bg-neutral-600">لغو</button>
    <button mat-button (click)="save()" [disabled]="!status()" class="bg-primary-500 text-white border border-primary-600 px-4 py-3 rounded-lg text-sm font-semibold transition-all duration-300 hover:bg-primary-600 hover:border-primary-700 disabled:bg-neutral-400 disabled:border-neutral-500 disabled:text-neutral-700 disabled:cursor-not-allowed">ذخیره</button>
  </mat-dialog-actions>
</div>
