<mat-toolbar class="header">
  <div class="flex items-center justify-between w-full">
    <button mat-icon-button [matMenuTriggerFor]="menu" class="menu-button">
      <mat-icon>menu</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
      <button mat-menu-item routerLink="/admin/dashboard" (click)="$event.stopPropagation()">داشبورد</button>
      <button mat-menu-item routerLink="/admin/users" (click)="$event.stopPropagation()">کاربران</button>
      <button mat-menu-item routerLink="/admin/products" (click)="$event.stopPropagation()">محصولات</button>
      <button mat-menu-item routerLink="/admin/orders" (click)="$event.stopPropagation()">سفارش‌ها</button>
      <button mat-menu-item routerLink="/admin/settings" (click)="$event.stopPropagation()">تنظیمات</button>
      <button mat-menu-item (click)="logout(); $event.stopPropagation()">خروج</button>
    </mat-menu>
    <mat-slide-toggle [checked]="isDarkTheme()" (change)="toggleTheme()">
    </mat-slide-toggle>
  </div>
</mat-toolbar>
<router-outlet></router-outlet>
